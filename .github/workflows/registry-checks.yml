name: Registry checks

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - ".github/workflows/registry-checks.yml"
  pull_request:
    paths:
      - "registry/**"
      - ".github/workflows/registry-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: registry/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
